# Render deployment config — https://render.com
# This file lets Render auto-detect and configure both services
# from the GitHub repo in one click.

services:
  - type: web
    name: fair-split-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel frontend URL after deploy
    healthCheckPath: /
    autoDeploy: true
